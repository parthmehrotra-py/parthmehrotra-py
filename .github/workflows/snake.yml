name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths: ['README.md']

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'parthmehrotra-py/parthmehrotra-py'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: parthmehrotra-py
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=%23e06a7d&color_dots=%23242033,%233d2b51,%2372519a,%23a578ce,%23cfb1eb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated animation in profile repository only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
